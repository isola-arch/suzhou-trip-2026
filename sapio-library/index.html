  sh3day:{body:"【帖子原文】\n亲身走完一趟才发现提前做好的地图版攻略有多省心….规划好的路线和实际游玩体验基本全都对上了，真心把这份实用攻略分享给准备出发的姐妹，出行前把要点摸清楚，游玩全程都顺顺利利！\n-\n🗺️ 上海三日完整游玩路线\n🏙️day1：上海邮政博物馆➡️外白渡桥➡️外滩➡️金陵东路渡口➡️陆家嘴➡️东方明珠\n🏙️day2：愚园路➡️安福路➡️乌鲁木齐中路➡️五原路➡️武康路➡️武康大楼\n🏙️day3：静安寺➡️马勒别墅➡️淮海中路➡️思南公馆➡️上海新天地➡️上海博物馆\n-\n💤住宿 & 游玩实用建议\n1. 住宿优先选外滩、南京路附近，出行逛景点超方便，交通四通八达，晚上出门闲逛也很省心\n2. 上海博物馆周一不开放，想去游玩一定要错开时间，免费入场名额记得提前线上预约好\n3. 老洋房街区人流量大，不用扎堆挤热门点位，钻进周边小众小路游玩，体验感会更好\n-\n🍜 上海美食真实口感分享\n1. 李百蟹・蟹黄面・临江餐厅（外滩・豫园店）\n分量拿捏得刚刚好，一人食吃着刚刚好不会撑。蟹料调配得很均衡，不会一味偏咸，配上面条吃着很顺口。饭后搭配的抹茶小点心口感绵密，清甜口中和掉面食的厚重感\n2. 外滩家宴・上海菜（外滩南京路店 / 外滩豫园店）\n红烧肉酱汁调得很有特色，带着淡淡花香层次很丰富。鳝鱼菜品保留食材本身鲜味，做法很讲究，口味老少都能接受\n3. 沪公馆・上海菜\n偏向清淡适口的口味风格，蟹粉捞饭吃起来温润养胃，日常逛累了吃特别舒服。熏鱼属于越品越有味道的菜式，日常当个小菜配饭超合适，整体菜式低调好吃\n#上海旅行日常[话题]# #上海短途出游[话题]# #上海游玩好去处[话题]# #外滩游玩攻略[话题]# #陆家嘴[话题]# #外滩[话题]# #上海特色美食[话题]# #上海住宿挑选[话题]# #上海旅游[话题]# #上海游玩[话题]# #上海旅行[话题]# #上海旅游攻略[话题]# #上海出行攻略[话题]# #魔都三日游[话题]# #上海城市漫步[话题]# #魔都游玩指南[话题]#"},
  harajuku:{transcript:"日本潮流路線原宿表參道南青山怎麼逛？按這個方式走，趕緊收藏。買手店逛能比商場省，所以我們從表參道站下車，A5出口先往南青山方向走。那這一路遊客都非常少，走在路上的人都是滿滿的老錢氣息。南青山很簡單，主街是成一為主，兩邊延伸的是高檔買手店和小眾品牌。那推薦幾家店啊，CDG川久保玲總店設計前衛獨特。日本匡威有很多東京限定。H Beauty & Youth非常出名的買手店，B1還有中古商品。Yohji Yamamoto，聽說經常能在這遇到山本耀司本尊。這家店有超多受歡迎，非常Fancy。其他還有W Taps、L'Appartement、EM首飾店、Yanuk & OYAMA牛仔褲專門店、Sacai設計師店、Kura Ne的小眾包包。這些一邊逛一邊走就到了隈研吾大師設計的根津美術館。重點是你可以在市區看到日式庭園。那南青山的精美下午茶店很多，但是如果只選一家，還得是根津美術館裡的森林咖啡店，很美很靜，我的東京Top寶藏地。20分鐘以後，我們直奔表參道。表參道作為東京最繁華的地段之一，和銀座一樣，沿路分佈的都是高奢品牌。那這裡整個片區有很多同品牌店重複出現，裡面主打的支線不同。大家經常會問的問題就是原宿有沒有三宅一生，新宿有沒有回中古，具體地址在哪？因為咱們是國內IP不在國外，沒辦法用Google地圖。那提前應該怎麼計劃？那大家可以嘗試用起來AI軟件，我本人比較喜歡用唐訊元寶，讓它給我寫出來這個區域所有我需要的店鋪。它不僅會告訴你店鋪地址、營業時間、交通路線，還會說明裡面是主線、副線還是快閃店，裡面賣的是衣服、包包、限定展覽都能一清二楚。做好功課，逛起來超簡單。那主街有兩個商場值得逛。一個是安藤忠雄設計的表參道Hills，動線非常奇特，它是一個環繞型的斜坡步道。反正日系女裝店鋪很多，比如說Fray I.D、Styling、Kura Ne、Jil Sander，它這裡面數一數二的大，值得一逛。另外一個是Zara藝術商場，包含了超多的潮牌店鋪，還有超高人氣的Amalou & QOO也在這附近。另外這條路上的Kashira帽子店，店大貨全，有中古打折，你可以在這慢慢選慢慢試。主街兩邊進去就是中古店和潮牌店，主要就集中在裡原宿這一片區域，日本潮流文化的發源地。比如說Journal Standard，必逛買手店。Tokyo Bopper的鞋子超級有特色的。Beauty & Youth原宿本店R&D3D非常好逛。Neighborhood有機會進去，樓上是Supreme。還有非常喜歡的Carhartt工裝品牌。Nami人氣超高的聖潔原宿。人氣小吃店X & X，別上了，我3點去还要排队。想預約飯店的話，TableLog已經上線了微信小程序，那國內遊客用微信支付就能搞定啦。裡原宿的對面Kiddy Land有超多動漫周邊，它旁邊進去就是貓街，風格偏休閒。Marshmallow & Bird、Number Sugar手工牛軋糖、小資文藝咖啡店，時髦精就來這裡City Walk。到了原宿，開啟Easy模式，集中在三個商場裡。1、Laforet，主打日系本土品牌，風格大雜燴，有潮牌、Lolita、哥特風、朋克風、甜美風，而且這個商場非常有意思，它是半層半層的，內容特別豐富。6樓偶爾會有漫展走秀，如果遇到有機會可以看一看。2、Tokyu Plaza，1樓的萬花鏡入門超級好拍，咋拍咋出片。B1 Kotomono Marche手工飾品店。4樓Kiwada Kiwada日本特色襪子店。頂樓Bills不排隊可以試試看。這個樓的店鋪不多，我們快速過。3、Harajuku，去年新開的一個打卡地，鏡面外觀巨美，尤其是7樓的露空天台，環境好風景好，拍照休息可以來這。那剩下的幾層樓呢，主要是雜誌、藝術展、輕食飲品。B1還有一個小山湯可以泡澡，美人只要25塊，可以體驗一下。竹下通，我覺得它更像是學生黨熱鬧的一個商業小巷子，有扭蛋、娃娃機、大頭貼、貓咖、手咖、動漫周邊，像一個縮小的池袋秋葉原。那最後原宿車站有個超大的Cosme美妝店，3月份重新裝修開業，有很多新牌子入駐，一定要去掃貨。那如果不知道買什麼，直接衝他們的榜單大賞排名123，一定不會出錯的。還有隔壁松本清藥妝店，再來補充一些日用品、保健品、藥妝。他們有些很神奇的小東西，比如說漱口水、客、腰痛發熱貼、防曬噴霧、增強記憶力的小藥丸等等。以上原宿表參道南青山的逛街攻略，下一篇來日本旅遊一定要買這幾樣東西。喜歡的朋友可以點贊。"},
  socialskills:{transcript:"怎麼樣你可以快速和任何人成為朋友?交友的第一點千萬不能瘋狂吹捧,真正的獵人是以獵物的方式出現的。有學到,我看過一個視頻,中情局的特工就在說,所以說我每次跟別人搭訕的時候,我都會說,我叫逐字研究剛剛那段話。你在參加一個party,有帥哥是我的菜,怎麼開口?你要讓對方覺得是他自己主動的。當對方在思考你的問題的時候,你就搶占了他的注意力。哪些環境,哪些場合是很容易搭訕成功的?所以我常常會 太牛了。 哈嘍大家好,我是侃醬,正在全球尋找100個快樂的人,與你分享獲得快樂的勇氣和智慧。今天我們的嘉賓是夏蒙然,歡迎夏姐。因為你是我朋友圈裡面的頂級大藝人,你又全世界旅遊嘛。今天就是要聊說怎麼樣像你一樣可以快速和任何人成為朋友。書裡面寫了一個我跟一個瑞典大叔聊天的故事。這個瑞典大叔也挺好玩的,我們倆在餐廳偶遇,他點了一個那個拉薩,我也想點。他就說你是新加坡人嗎?我說不是,我是中國人。然後他就說,哦,他喜歡王家衛。我就立刻跟他說,王家衛最近出事了,你知道嗎?我就大說特說,也不是八卦吧,就是他感興趣什麼東西,你給他一些額外的信息。哇,但如果他是王家衛的鐵桿粉絲怎麼辦?你不怕他不開心嗎?交友的第一點就是你不要討好別人,就是你要反駁他,提供增量,比如說,哎,你覺得我這東西好不好看?哇,很好看。 但是如果能夠有不同的意見建議就會可以聊起來。你真正的交友不是說你會說一些什麼華麗的語言,而是你要對一個事情有你自己的觀點,跟你自己的洞察。看到這裡的朋友,同意下姐反駁型交友觀點的扣一,不同意的扣二。如果現在在飛機上,你很想認識鄰座的朋友,你會如何開口去認識他?飛機不是一個很好的場景,到了飛機上大家都是一個準備休息的狀態,所以我就找不到那個切口。哪些環境,哪些場合是很容易搭訕成功的?所以我常常會在運動的時候跟人搭訕。運動。對,運動是一個非常好。哎,為什麼是運動的時候?運動就是一個群體行為,比如說跑步有跑團,你舉重你得有一個人幫你去做調整槓鈴片,然後學習小組是一個非常非常好的交友的行為。去年上了那麼多興趣班,其實我交了非常多朋友,比如說按摩,我不可能自己給自己按吧。比如說脫口秀,你得有觀眾吧,就是你說完了觀眾你就說,哎,你覺得我剛說的怎麼樣? 第二個場景,如果你在參加一個party,現場有帥哥讓你覺得這是我的菜,你想加他的微信也好,Instagram也好,你會怎麼開口?我一般不跟帥哥搭訕。啊,為什麼?就是我覺得帥哥太focus在他們自己,我會覺得帥而自知是非常沒有信張力的一種行為。如果現在不是帥哥,只是一個hot nuts,就是很吸引的一個男性,你很 說最近一個案例好了,我最近有一個約會對象。把我當成他,這樣會好玩一點。好好。我會從他手裡面做的事情開始看。如果你現在在跑步。對,你現在在跑步,我就會說,哎,你這雙鞋哪買的?你常常來這裡跑步嗎?對,我每個禮拜都來這裡。哎,太棒了,我最近也才剛來這裡,我覺得你的配速不錯,我跟你跑一段吧。跑著跑著,跑休息一下,這裡有很不錯的海。走。比如說如果他是一個攝影師,我就會說,哎,你這個麥克風很不錯,在哪買的?我會要鏈接。為什麼要鏈接?因為要鏈接等一下你們加微信或加Instagram不尷尬。好,下一個啊,如果你一個人背包旅行,在青旅的公共區域,看到一個同樣獨自出行的背包客,你想約他第二天一起逛,你會怎麼說?我還是會先從他手上做那個事情入手。比如說我跟另一個約會的對象,就是當時我們在一個共享辦公空間,他當時坐在窗外那張桌子,我也看中那個位置,我就走過去跟他說,我說,哦,原來你也喜歡這張位置。下次你可以跟我講,比如說你幾點要幾點要坐,你不做的時候我可以來做。就跟他就是先認識了,第二天我又過去,我就說,你今天沒有出去玩嗎?我說,哦,那你做什麼的?那你平常都在做什麼?他說他平常很喜歡爬山。我說,那你下次你約我爬山,他第二天真的約我。哎,你會讓別人來約你。我會跟他說我喜歡什麼什麼,你下次做什麼什麼的時候可以帶我一起。哦,你會引導他來向你發出邀請。對,我看過一個視頻,應該是CIA中情局的一個特工。專業的。好專業的。這個中情局的特工就在說,真正的獵人是以獵物的方式出現的。這個理論就是當你想要勾搭一個人,或者說跟一個貴人建交的時候,你要讓對方覺得是他自己主動的。所以我每次跟別人搭訕的時候,我都會說,最近我很喜歡做什麼什麼什麼,如果你也想做的話,你約我一起好不好?然後對方就是大概率會約你。我叫逐字研究剛剛那段話。 而且我看你你是其實每一天都會循序漸進往前一步。你今天可能說,啊,你觀察到這個人,然後第二天你會說,啊,這個你就會跟他進行一些簡單的small talk,第三天你會跟他再有一些後續的,就是要混臉熟,在一個固定的場景,然後反复出現。這樣兩個人好像有一種天然的一種,哎,我們就該認識。我搭訕人都是放長線釣大魚。首先我不喜歡帥哥,就是我對於帥哥完全不強調。過張凌赫啊,什麼,啊。如果後面你說,哎,你可以約我哈,但是這個人後面沒有真的約你。我會給自己三次機會,就建立在我對這個人真的很感興趣。我三次主動約他,他不被我約出來,那這個事情就game over。你約第一次,他說,哦,可能友忙,可能他真的忙,但是三次我就覺得意思很明顯了。那就算了。 我為什麼在巴厘島我搭訕成功率那麼高?是因為我去巴厘島,我就是想要找人跟我一起去玩。這個目的也沒有很功利的。其實真正好的關係,最好就是不要是功利性的關係。他們自然在相處過程當中,其實你們就知道彼此的性格是什麼,彼此需求是什麼,自然就會有下一步。 大家可以填寫你的答案,練習把這句話打在評論區哦。比如說,最近我喜歡攀岩,如果你也喜歡做這件事的話,可以約我一起。那下一個場景啊,你一個人在咖啡館辦公,隔壁桌的人正在聊一個你特別感興趣的話題,你想加入他們的對話。上次搭訕是這樣子,我去一個餐廳吃飯,旁邊那個男的呢,是帥的。我就主動說他是做什麼的?他說他是一個生命教練。我就說,哦,你是一個生命教練,我最近剛好有一個在想是什麼東西真的會讓一個人重啟人生。他就立刻說,哎,我覺得有兩件事情會讓一個人重啟人生,一個叫啟發,一個叫痛苦。哇,interesting,很有趣。所以我們就互相聊天,然後就彼此認識。那如果我想不到這樣的這個鏈接和共同點怎麼辦?我覺得你太厲害了。如果我普通人,我不像你一樣,我就是腦袋裡空空如也,我就是太普通了。我覺得首先沒有任何一個人是普通的,因為大家都有長了。我搭訕常見的路徑就是,哎,我最近在思考一個什麼東西,我就會拿這個東西來問別人,你覺得呢?然後當你們在聊起來的時候,你們就互相知道說,哎,我跟這個人合不合的來。就有些人就是說,哦,我不認同你,我覺得你說的非常的無聊。那有些人非常開放說,哦,你說的很有意思。你就大概知道說,哦,這個人他長得帥,但是他講話這樣很低微,我不要跟他在一起。那有些人就是說,他長得帥不帥,但是跟他聊天很有趣。所以我覺得本身還是你自己的腦子裡面會有很多思考,你只是把這些思考順便拿出來而已。特別好,而且你剛剛會把就是話遞給對方,就是你會說你覺得呢?就是你會拋出一個一個問題,但是讓對方來回答。他在回答過程中,他是成長型思維,他是保守型思維,這些東西你就能摸到。搭訕最重要的是你們要有一個開放性對話。什麼叫不開放性對話?你到了一個地方就是,哇,我覺得你好帥,我想認識一下你。對方就會說,好,然後呢?然後沒有然後了。就這個對話就是哪怕你們彼此之間有意思,但是這個對話到此為止了。就哪怕不是搭訕,就是在一個社交場合,然後你想要去破冰,千萬不能是瘋狂吹捧。就這個吹捧會讓別人覺得有點拘束,這個拘束就是,我我我你長得好好漂亮。那你讓對方怎麼回答?現在的你,你會怎麼誇別人?比如說你是侃醬,想認識你,我說,哇,侃醬,我一直在看你的視頻,我覺得你視頻節奏真的非常好。我會說一些劇情濃縮,比如說,啊,你最近一期黃一蛋的視頻,我真的看了好多遍。黃一蛋對著鏡頭,我覺得他跟日劇裡特別像,我特別喜歡。在一個陌生場合理,你想認識一個在某個行業當中做出了一些成績的人。這個東西的前提一定是你在之前要對他做大量的研究跟調查。你不能說,哇,Jason Wang,你芯片做得好好。廢話,我不要你講。當你們有機會碰到的時候,你就會知道說,OK,我現在有百分百的把握能拿下他。什麼叫拿下他?其實就是獲得他的注意力。很多時候我看到一個人,他跟我同一個場景出現,但他在舞台上。這個時候我不會跟他去say hi。首先,他在一個那樣的場景裡,我沒有辦法獲得他全部的注意力。但如果接下來有一個場景,我們可以彼此認識,我有信心,有機會讓他對我非常欣賞。 看到這的朋友,你們還有哪些和陌生人快速建立連接的方法嗎?歡迎打在評論區,我們一起討論。以及大家在社交場合,大家要區分什麼叫大問題,什麼叫小問題。如果問一個小問題,哇,侃醬,我覺得你每次的視頻的嘉賓都選得好棒哦。你選視頻的嘉賓,有些什麼標準嗎?這個標準是成功的人,還是說在某一個小的領域當中做著自己小事業的人?哇,這個問題好高級啊。對,所以是其實對方會真的思考,當對方在思考你的問題的時候,你就搶占了他的注意力。所以一個是問題要小,切口要小。很多粉絲會問說,啊,有時候問老闆,然後他也不知道他自己要什麼。我就說你給他兩個選擇。當時我們在市場營銷學當中有一個核心的觀念,就是當你想要去讓你的用戶做出決策的時候,你不要給他太多選擇。你要問他要A還是要B。這個東西如果放在搭訕男生,或者說你約一個人去喝咖啡的這個點上,你錯誤案例示範,你不要問,我們週六去喝咖啡好不好?你就是給他好跟不好各50%的機會。你要問他,我們週六下午是去喝A咖啡還是B咖啡?我們奧德賽14號上映,我們是在上海影城看還是想去普東?然後百分百中。因為他就是覺得,你現在是在讓我做選擇,對吧?所以這條視頻大家是想點贊還是收藏呢?是希望三連還是四連呢?嗯?嗯?"},
  branding:{body:"# 像宗教一样建立品牌（1）：找到共同价值\n\n**by A-Les Studio** · #品牌设计 #品牌方法论 #小品牌主理人 #品牌共同体 #aha这也是艺术\n\n一年前，我在纽约做品牌设计师。一次拍品牌照片，老板对摄影师说：\n\t\n“要让人一看就觉得，这就是我想要的生活。”\n动作、穿着、神态都要具体。这让我开始想：品牌想让人进入怎样的生活，又为什么值得向往？\n\t\n做品牌设计的第四年，我在 Pratt 读研，研究方向是宗教式品牌搭建。\n我想探索：怎样创造一个受众愿意进入的品牌世界，让人通过共同价值、象征、反复参与和彼此连接，逐渐形成认同。\n\t\n我借用“教义、神迹、圣物、仪式、信众”来组织教学，分别检查其共同价值、兑现依据、象征意义、重复实践和成员关系。\n*这是我的品牌设计框架，宗教是理解这些关系的类比。\n\t\nstep01\n先写出“教义”：你与受众共同重视什么，以及愿意怎样实践它。\n\t\n① 找到一个具体处境，写下：谁，在什么时候，遇到什么困扰？\n\t\n虚构示范：一个日常服装品牌，面向早晨时间紧张、又担心总穿同样几件衣服显得敷衍的人。\n\t\n这是待验证的用户假设，需要通过真实交流核实。\n\t\n② 从困扰中提炼共同价值，别停在“我们重视品质”。\n\t\n继续问：我们希望这群人怎样看待自己和生活？\n\t\n示范：“重复穿着也值得被欣赏。”\n它尝试提供一个认同的理由：重复穿着，也可以是认真安排生活的一种方式。\n\t\n③ 让价值指导一个选择\n\t\n如果相信这句话，品牌会优先完善几款衣服之间的搭配，接受较少的款式；呈现同一件衣服的不同穿法，让用户交流彼此的重复穿着经验。\n\t\n这就把共同价值接到了产品、视觉和参与。\n\t\n现在可以开始梳理你的品牌卡片：\n*可以保存图5，慢慢研究\n用户处境：____\n我们共同重视：____\n因此优先／接受：____\n用户可以实践的一个动作：____\n\t\n完成后，检查三件事：\n• 找到一位目标用户，问他是否认同，并请他讲自己的经历。\n• 用它解释一次真实的产品或视觉选择。\n• 指出一个与价值有关、用户愿意尝试的动作。\n\t\n答不出来，就继续修改。这张卡是待验证的草案。\n\t\n下一篇，我们做一张“主张—行动—验证”表，检查产品和服务怎样让这份共同价值可信。\n#品牌设计[话题]# #品牌方法论[话题]# #小品牌主理人[话题]# #品牌共同体[话题]# #aha这也是艺术[话题]#\n\n---\nlikes 5507 · saves 5638 · comments 60 · shares 1418"},
suzhouautumn:{body:"# 后来我逢人便说，苏州的秋天有多美‼️\n\n直到我来到了秋日的苏州，才知道\"层林尽染\"有多具象。虎丘的一步一景，留园火出圈的红枫，每一步都像闯进古画，相机快门根本停不下来！\n\n## 🍁 虎丘（p1,4,5,6,8,9,13,14,15,16）\n苏州秋日首选必须是虎丘！这里藏着超多天然取景框，框架式构图随手拍都是古风大片。\n\n划重点❗️一定要赶第一波开门冲——避开人群不说，晨光斜照在门洞上，光影质感直接拉满。还有超多粘人的小猫咪🐱，记得带根逗猫棒❗️收获\"秋日喵星人同框照\"，氛围感绝了。\n\n## 🍁 留园（p2,3,7,10,11,12)\n今年留园的红枫真的火到没朋友！主包特意打卡，虽然下午人不少，但红枫配古亭的画面，完全值得挤一挤。\n\n划重点❗️务必 4 点前到园——赶在日落前的黄金光线，落日余晖洒在红枫上，叶片红得发亮，拍出来自带柔光滤镜。\n\n---\n来源：小红书 @Freez醉影（摄影博主 · 非商家号）· 2026-11 秋季实拍 · 404赞 277藏\n"},
  metro:{body:"# 终于有人把苏州地铁🚇说清楚了\n\n来苏州不想打车绕路的宝直接抄作业！大部分热门景点地铁就能直达🚇高铁站基本都能无缝换乘地铁，行李多也省心❤️古城片区地铁站到园林大多还要步行几百米，预留好走路时间，错峰坐地铁避开晚高峰。\n\n## ✅地铁沿线热门景点\n- 🚇1号线：木渎古镇、苏州博物馆西馆、诚品生活苏州、东方之门\n- 🚇2号线：西园寺、山塘街、留园\n- 🚇3号线：东吴博物馆、上方山森林公园\n- 🚇4号线：观前街、沧浪亭、盘门景区\n- 🚇5号线：网师园、桂花公园、斜塘老街、太湖湖滨国家湿地公园\n- 🚇6号线：虎丘、苏州博物馆、拙政园、狮子林\n- 🚇7号线：苏州中国花卉植物园、中央公园、桃花坞历史街区\n- 🚇8号线：虎丘湿地公园、御窑金砖博物馆\n\n## ✅热门景点预约\n- 苏州博物馆：提前7天，「苏州博物馆」\n- 拙政园：提前7天，「苏州园林旅游」\n- 狮子林/留园/网师园：提前1-2天，「苏州园林旅游」\n- 虎丘：提前3天，「君到苏州」\n- 西园寺：提前1天，「君到苏州」\n- 寒山寺：提前1天，「君到苏州」或「寒山寺」\n\n## ✅美食打卡\n哑巴生煎（苏式生煎名店）· 苏外婆（平江路苏帮菜，松鼠桂鱼）· 祥鑫饮食店（卤鸡爪）· 采芝斋（松仁粽子糖，伴手礼）\n\n---\n来源：小红书 @一只猪蹄 · 948赞 1747藏 · 高收藏工具帖\n"},
  autumnvideo:{body:"# \"这个月的苏州，是封神级别的中式秋景\"\n\n开始期待下个月苏州的秋天🍂\n\n📷 拍摄点位：拙政园、虎丘、天平山、留园、艺圃\n\n---\n来源：小红书 @小辣椒吖 · 视频帖（未转写，画面向秋景合集）· 6864赞 3142藏\n情报价值：天平山入镜——苏州红枫第一名山（天平红枫甲天下），11 月中下旬峰值；艺圃再被点名\n"},
  suzhou3day:{body:"# 苏州📍三天两夜｜不绕路版保姆级逛吃攻略\n\n## 🗺️三日游路线\n**Day1 古城经典线**：拙政园 ➡ 苏州博物馆（周一闭馆，提前约）➡ 狮子林 ➡ 耦园 ➡ 平江路（走支巷）➡ 观前街\n**Day2 园林古寺线**：虎丘（看云岩寺塔）➡ 寒山寺 ➡ 枫桥景区 ➡ 留园 ➡ 西园寺（素面+猫猫符）➡ 七里山塘街（坐摇橹船）\n**Day3 现代艺术线**：东方之门（\"大裤衩\"地标）➡ 金鸡湖大相框（傍晚出片）➡ 月光码头 ➡ 诚品书店 ➡ 苏州之眼摩天轮 ➡ 李公堤（金鸡湖夜景收尾）\n\n## 🥘亲测美食\n- **李百蟹·蟹黄面·平江河畔（平江路总店）**：蟹黄蟹肉铺满碗面几乎看不见面，苏式细圆面拌开每根裹蟹油，咸鲜带回甘\n- **姑苏船宴河景餐厅**：临河二层小楼傍晚氛围足，松鼠桂鱼炸得蓬松昂首翘尾，番茄酱调酸甜汁挂匀，外酥内软\n- **晚园苏式火锅**：巷子里的中式庭院风，番茄锅底浓稠酸度明亮，涮菜前先喝汤，江南九宫格\n- **仁春园·苏帮菜·苏式面宴**：枫镇大肉面白汤底清亮带酒酿微甜，焖肉整块炖到筷子可拆，肥瘦相间\n\n## 💡旅游大实话\n1️⃣ 园林周一别跑空：苏博和大部分园林周一闭馆（帖称拙政园留园都是——出行前复核）\n2️⃣ 拙政园早点去：7:30 开门就冲，9 点后人流上来体验直线下降\n3️⃣ 平江路钻支巷：两侧小巷才是宝藏，人少安静\n\n---\n来源：小红书 @墨晔 · 11K赞 11K藏 · 与我们 Day2 排法互证（虎丘→寒山寺→留园方向一致）\n"},
  novdebate:{body:"# 苏杭很美，但十一月份真的不建议来（视频·未转写）\n\n苏杭很美，但十一月份真的不建议来。话不好听，但这就是苏杭旅游最近的现状。\n\n---\n来源：小红书 @午阳 · 视频帖（未转写）· 75赞 126藏 · ⚠反方观点+「旅游推荐官」标签，疑似引流 clickbait\n我方对照：Open-Meteo 显示 11/17–18 冷锋过境后 19–22 全晴回暖——该帖论点大概率为「11 月阴雨冷」，对选中窗口不适用；若其论据不同（红叶未红/人流/酒店涨价）需转写核实\n"},
  guide2:{body:"# 苏州游玩攻略（苏外婆商家号第二帖）\n\n苏州会惩罚每一个不提前预约的P人。景点预约指南，可直接抄作业。\n\n## ✅不绕路线路\n- Day1：拙政园→苏州博物馆→狮子林→平江路→慎德堂评弹茶馆\n- Day2：虎丘→寒山寺→西园寺→留园→七里山塘\n- Day3：十全街→网师园→金鸡湖→月光码头→东方之门\n\n## ⚠️旅游避雷\n1. 平江路、山塘街主街不随便买高价丝绸等特产，溢价高，特产优先正规老字号\n2. 拙政园、苏州博物馆提前线上预约，现场基本无余票，节假日秒空\n3. 景区门口拉客的游船、一日游别选，坐船选官方码头\n5. 租汉服别只看低价，检查服装破损、配饰齐全，问清还衣时间和违约金\n6. 老城区街巷狭窄，不要全程打车，短途步行或共享单车更方便\n\n## ✅美食\n苏外婆·苏帮菜（松鼠桂鱼，自家软广）· 鑫震源（大虾生煎，整颗虾仁皮薄底脆汤汁充盈）\n\n---\n来源：小红书 @苏外婆·苏帮菜·松鼠桂鱼(大儒平江2店) · 70赞 93藏 · ⚠商家号，苏外婆为软广，避雷清单为通用常识已采信\n"},
  suzhou:{body:"# 后悔‼️苏州这座被严重低估的城市\n\n来苏州玩别慌，按这几点走，省心又省时间，重点是美食全打卡！！！\n\n## 🏞️苏州三日游线路\n\n1️⃣ 拙政园→苏州博物馆→狮子林→平江路→观前街\n2️⃣ 虎丘→寒山寺→西园寺→留园→七里山塘\n3️⃣ 十全街→网师园→金鸡湖→月光码头→东方之门\n\n## ⚠️苏州旅游注意事项\n\n🔸苏州博物馆分为本馆和西馆。西馆无需预约，本馆可提前7天预约，逢周一闭馆\n🔸苏州适合放慢脚步游览，行程不宜安排过密，每日打卡2-3处景点即可\n🔸平江路主街小吃定价偏高，钮家巷、萧家巷一带有不少本地人光顾的店\n🔸苏州多处园林设有学生优惠，出行携带学生证可享门票半价\n🔸诚品书店楼梯为热门打卡点位，拍完照可前往三楼儿童区，超大露台可眺望金鸡湖与东方之门\n\n## 😋苏州地道美食\n\n✅苏外婆·苏帮菜：苏州平江路高人气家常苏帮菜馆，松鼠桂鱼、手剥河虾仁、东坡肉等招牌菜\n✅三万昌：招牌碧螺知春茶香醇厚，茶味大于奶香，口感清爽不腻\n✅祥鑫饮食店：招牌卤鸡爪软糯脱骨，带着淡淡的苏式甜香\n✅阊门姚记豆浆：老阊门旁的老牌早餐店，24小时营业，是古城有名的深夜食堂\n\n---\n来源：小红书 note 6aa94adc000000002902f882 · 帖主「苏.外婆苏帮私房菜」（商家号——苏外婆为自家推荐，软广属性已标注）\n抓取：embedded __INITIAL_STATE__ JSON · 2026-11-11\n"},

document.getElementById('stats').textContent = NOTES.length+" notes · XHS lane (embedded JSON + SenseVoice)";

const grid=document.getElementById('grid');
grid.innerHTML=NOTES.map(n=>`
 <div class="card" onclick="openNote('${n.id}')">
   <img class="cov" src="${n.cover}" loading="lazy">
   <span class="badge xhs">XHS · ${n.type==='video'?'影片':'圖文'}</span>
   ${n.dur?`<span class="dur">${n.dur}</span>`:''}
   <div class="cbody"><div class="ctitle">${n.title}</div>
   <div class="cmeta">@${n.uploader} · ${n.likes} likes</div>
   <div class="ctake">${n.take}</div></div>
 </div>`).join('');

async function getTxt(u){
  try{ const r=await fetch(u); if(r.ok) return await r.text(); }catch(e){}
  return null;
}
async function openNote(id){
  const n=NOTES.find(x=>x.id===id);
  const d=document.getElementById('detail');
  let bodyHtml='', transHtml='', imgHtml='', commentHtml='';
  const noFileHint=`<div class="note-eng">⚠ file:// 直接打开时读不到外部文本——正文/逐字稿需经本地 server（如 <code>python -m http.server</code>）才显示；图片不受影响。</div>`;
  let fileBlocked=false;
  const inl=(typeof INLINE!=='undefined'&&INLINE[n.id])||{};
  if(n.bodyFile||inl.body){
    const t=inl.body||await getTxt(n.bodyFile);
    if(t){ bodyHtml=`<h3 class="block">正文</h3><div class="bodytxt">${esc(t)}</div>`; } else fileBlocked=true;
  }
  if(n.transcriptFile||inl.transcript){
    const t=inl.transcript||await getTxt(n.transcriptFile);
    if(t){ transHtml=`<h3 class="block">逐字稿（verbatim）</h3><div class="transcript">${esc(t)}</div>`; } else fileBlocked=true;
  }
  if(n.images){
    imgHtml=`<h3 class="block">圖片（${n.images.length}）</h3><div class="imgs">${n.images.map(u=>`<img src="${u}" onclick="lb('${u}')">`).join('')}</div>`;
  }
  let frameHtml='';
  if(n.frames){
    const fdir=`notes/xhs-${n.nid.slice(0,8)}-${n.id}/frames`;
    const fimgs=Array.from({length:n.frames},(_,i)=>`${fdir}/f${i}.jpg`);
    frameHtml=`<h3 class="block">Frames（${n.frames} 幀 · 均勻截取 · click 放大）</h3><div class="imgs">${fimgs.map(u=>`<img src="${u}" onclick="lb('${u}')" loading="lazy">`).join('')}</div>`;
  }
  let placeHtml='';
  if(n.places){
    placeHtml=`<h3 class="block">抽出嘅地點（${n.places.length}）</h3><div class="tags">${n.places.map(p=>`<span class="tag" title="${p.type}${p.frame?' · 見於 '+p.frame:''}">${p.n}</span>`).join('')}</div>`;
  }
  d.innerHTML=`
   <div class="panel">
    <div class="phead">
      <img src="${n.cover}">
      <div class="pinfo">
        <h2>${n.title}</h2>
        <div class="who">@${n.uploader}</div>
        <div class="tags">${n.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="eng">❤️ <b>${n.likes}</b> 💬 <b>${n.comments}</b> <span class="note-eng">engine: ${n.engine}</span></div>
        <div class="srclink">source: <a href="${n.src}">${n.src}</a> · note ${n.nid}</div>
      </div>
    </div>
    ${placeHtml}${fileBlocked?noFileHint:""}${bodyHtml}${transHtml}${frameHtml}${imgHtml}${commentHtml}
    <button class="closebtn" onclick="document.getElementById('detail').classList.remove('open')">收埋 ↑</button>
   </div>`;
  d.classList.add('open');
  d.scrollIntoView({behavior:'smooth',block:'start'});
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function lb(u){document.getElementById('lbimg').src=u;document.getElementById('lb').style.display='flex';}
</script>
</body>
</html>
